name: wefaq
description: "Wefaq: a respectful conversation companion."
publish_to: none
version: 0.1.0+15

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/wefaq_icon_concept.png
    - assets/content/questions_v1.json
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
